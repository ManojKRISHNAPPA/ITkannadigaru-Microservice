apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: instaclone

resources:
  - configmap.yaml
  - secrets.yaml
  - mysql-statefulset.yaml
  - backend-deployment.yaml
  - auth-service-deployment.yaml
  - user-service-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: instaclone
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# Images to be updated (useful for CI/CD)
images:
  - name: 156299069385.dkr.ecr.us-west-2.amazonaws.com/itkannadigaru/backend-service
    newTag: "1"
  - name: 156299069385.dkr.ecr.us-west-2.amazonaws.com/itkannadigaru/auth-service
    newTag: "1"
  - name: 156299069385.dkr.ecr.us-west-2.amazonaws.com/itkannadigaru/user-service
    newTag: "1"
  - name: 156299069385.dkr.ecr.us-west-2.amazonaws.com/itkannadigaru/frontend
    newTag: "1"

# ConfigMap generator (alternative to configmap.yaml)
# configMapGenerator:
# - name: instaclone-config
#   literals:
#   - DB_HOST=mysql
#   - DB_PORT=3306

# Secret generator (alternative to secrets.yaml - more secure)
# secretGenerator:
# - name: instaclone-secrets
#   literals:
#   - mysql-root-password=changeme
#   - jwt-secret=changeme
